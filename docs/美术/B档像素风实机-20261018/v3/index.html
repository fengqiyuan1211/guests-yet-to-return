</style></head><body><header><small>致未归的客人 · GODOT 实机</small><h1>原来的造型，细颗粒像素重绘</h1><p>已把确认的方向制作成 30 个独立素材，接入工作台与共享物品展示。</p><div class="notice">以下均为 Godot 独立测试存档的实际截图。小线和黄色生物继续使用原素材；角色、剧情、库存与配方规则未在本次修改。</div></header><main><figure><button class="image" data-full="04-workbench.png" aria-label="放大工作台 · 实际游戏画面"><img src="04-workbench.png" alt="工作台 · 实际游戏画面"></button><figcaption><h2>工作台 · 实际游戏画面</h2><p>18 款瓶装材料、5 种玻璃器具、7 件金属与手持工具已接入共享素材入口。保留原来的瓶型、工具造型和配方数据。</p></figcaption></figure><figure><button class="image" data-full="04-workbench-closed-shaker.png" aria-label="放大摇壶 · 合盖状态"><img src="04-workbench-closed-shaker.png" alt="摇壶 · 合盖状态"></button><figcaption><h2>摇壶 · 合盖状态</h2><p>独立壶身、滤盖和顶盖在游戏中组合。顶盖仍可点击打开，操作区域保持一致。</p></figcaption></figure><figure><button class="image" data-full="06-glass-liquid-alignment.png" aria-label="放大杯型 · 动态酒液"><img src="06-glass-liquid-alignment.png" alt="杯型 · 动态酒液"></button><figcaption><h2>杯型 · 动态酒液</h2><p>四种成品杯以同一测试酒液显示，杯形和透明区域保留；这是渲染检查画面，并非新增配方。</p></figcaption></figure><figure><button class="image" data-full="03-shop.png" aria-label="放大共享物品 · 商店展示"><img src="03-shop.png" alt="共享物品 · 商店展示"></button><figcaption><h2>共享物品 · 商店展示</h2><p>商店、备料柜和工作台取用同一个物品素材，因此瓶型和标签保持一致。</p></figcaption></figure></main><footer><p><a href="../v3-preview/">查看已确认的概念图</a> · <a href="README.md">接入说明与检查结果</a></p></footer><dialog id="viewer"><button id="close">关闭 ×</button><img id="large" alt="放大实机截图"></dialog><script>const d=document.querySelector("#viewer");document.querySelectorAll("[data-full]").forEach(b=>b.onclick=()=>{document.querySelector("#large").src=b.dataset.full;d.showModal()});document.querySelector("#close").onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()}</script></body></html>

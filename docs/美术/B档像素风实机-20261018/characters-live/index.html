ooter><a href="../characters-preview/?revision=chin3#merchant-update">已确认的设计图</a> · <a href="README.md">接入说明</a></footer><dialog id="viewer"><button id="close">关闭 ×</button><img id="large" alt="放大实机截图"></dialog><script>const d=document.querySelector("#viewer");document.querySelectorAll("[data-full]").forEach(b=>b.onclick=()=>{document.querySelector("#large").src=b.dataset.full;d.showModal()});document.querySelector("#close").onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()}</script></body></html>

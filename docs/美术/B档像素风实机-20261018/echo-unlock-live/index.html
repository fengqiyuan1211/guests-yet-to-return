<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回响 · 教程解锁提示</title><style>body{background:#211b17;color:#ead9b8;font:17px/1.8 system-ui;margin:0}main{max-width:1280px;margin:32px auto;padding:20px}img{width:100%;border:1px solid #806540}h2{margin-top:40px}p{color:#c7b694}</style><main><h1>回响 · 教程解锁提示</h1><p>Godot 实机截图，临时测试存档。游戏中的边框以约 3.2 秒周期轻缓呼吸；截图只展示其中一帧。开启减少动态效果时使用静态提示。</p><h2>新解锁：入口与酒谱卡片同时提醒</h2><p>完成新手调酒教程后解锁，主动跳过教学也沿用原流程发放。买齐材料不会提前解锁；不会自动加入营业酒单。</p><img src="echo-new-unlock.png" alt="回响新解锁"><h2>查看后：取消该酒谱的高光</h2><p>只有打开对应酒谱详情才会消除提示。若还有其他新酒谱，图鉴入口继续提示。未查看状态与已查看状态都会保存。</p><img src="echo-seen-unlock.png" alt="查看回响后的图鉴"></main></html>

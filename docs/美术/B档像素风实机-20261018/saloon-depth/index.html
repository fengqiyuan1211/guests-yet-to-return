<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吧台站位与空间 · Godot 实机</title><style>
*{box-sizing:border-box}body{margin:0;background:#171d26;color:#f3e4c6;font-family:system-ui,-apple-system,sans-serif}header,main,footer{max-width:1560px;margin:auto;padding:30px}header{padding-bottom:0}h1{font-size:34px;margin-bottom:15px}p{color:#c9c0af;line-height:1.8}small{color:#d0aa76;letter-spacing:2px}.notice{padding:14px 20px;border:1px solid #9e7b4c;background:#302b26;margin:20px 0}figure{margin:0 0 30px;background:#242934;border:1px solid #796044}figure img{display:block;width:100%}.image{padding:0;border:0;display:block;width:100%;background:transparent;cursor:zoom-in}figcaption{padding:20px 24px}figcaption p{margin:8px 0 0}h2{font-size:24px}a{color:#dfbd87}dialog{padding:0;border:2px solid #b29363;background:#171d26;max-width:98vw;max-height:98vh}dialog::backdrop{background:#000d}dialog img{display:block;max-width:95vw;max-height:92vh}dialog button{position:absolute;right:10px;top:10px;background:#171d26;color:white;border:1px solid #b29363;padding:9px 14px;cursor:pointer}.tag{color:#e9c382;font-size:13px;letter-spacing:1px}@media(max-width:750px){header,main,footer{padding:18px}h1{font-size:28px}}
 .compare{display:flex;gap:10px;margin:15px 0}.compare button{padding:12px 20px;background:#59402b;color:#f4dfb5;border:1px solid #bd935a;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.grid h2{font-size:22px}@media(max-width:900px){.grid{display:block}}</style></head><body><header><small>致未归的客人 · GODOT 实机</small><h1>客人站在吧台另一侧</h1><p>移除中间围挡和金柱，缩窄可见台面深度，让手部与腰部多露出一些。</p><div class="notice">实际游戏截图 · 独立测试存档 · 小线与黄色生物原画不变</div></header><main><h2>艾达 · 修改前后</h2><div class="compare"><button data-version="01-ada.png">现在：清理围挡＋台面下移</button><button data-version="before-ada.png">之前：围挡与金柱</button></div><figure><button class="image" id="heroButton" data-full="01-ada.png"><img id="hero" src="01-ada.png" alt="艾达站位对比"></button><figcaption><p id="caption">现在：腰间的手可见，裤腿被台面自然遮挡。</p></figcaption></figure><div class="grid"><figure><button class="image" data-full="01-hank.png"><img loading="lazy" src="01-hank.png" alt="老霍克"></button><figcaption><h2>老霍克</h2><p>交叠双手露在桌沿上方，下半身由前景台面遮挡。</p></figcaption></figure><figure><button class="image" data-full="01-milo.png"><img loading="lazy" src="01-milo.png" alt="米洛"></button><figcaption><h2>米洛</h2><p>肩带动作保留，客人站位直接连接大厅。</p></figcaption></figure><figure><button class="image" data-full="01-stick.png"><img loading="lazy" src="01-stick.png" alt="小线"></button><figcaption><h2>小线</h2><p>保持原有画风与素材，仅适配新的桌沿。</p></figcaption></figure><figure><button class="image" data-full="01-yellow_creature.png"><img loading="lazy" src="01-yellow_creature.png" alt="黄色生物"></button><figcaption><h2>黄色生物</h2><p>原画不变，抱臂动作完整保留。</p></figcaption></figure><figure><button class="image" data-full="03-night.png"><img loading="lazy" src="03-night.png" alt="夜间光照检查"></button><figcaption><h2>夜间光照检查</h2><p>台面与大厅共用光照材质，人物继续跟随原来的时间色调。测试只切换光照时间，所以顶部钟面仍是截图初始值。</p></figcaption></figure><figure><button class="image" data-full="02-1024x768.png"><img loading="lazy" src="02-1024x768.png" alt="4:3 窗口检查"></button><figcaption><h2>4:3 窗口检查</h2><p>背景、客人、前景桌沿共用同一坐标缩放，避免宽高比变化后错位。</p></figcaption></figure></div></main><footer><a href="README.md">接入说明与验证记录</a> · <a href="../characters-live/">上一版人物接入截图</a></footer><dialog id="viewer"><button id="close">关闭 ×</button><img id="large" alt="实机放大图"></dialog><script>const d=document.querySelector('#viewer');document.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{document.querySelector('#large').src=b.dataset.full;d.showModal()});document.querySelector('#close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{document.querySelector('#hero').src=b.dataset.version;document.querySelector('#heroButton').dataset.full=b.dataset.version;document.querySelector('#caption').textContent=b.textContent});</script></body></html>

="序章 · 自动播放"></button><figcaption><b>序章 · 自动播放</b><p>点击“自动播放”或按 A；空格和鼠标仍可手动推进。</p></figcaption></figure><figure><button class="shot" data-full="04-workbench.png" aria-label="放大调酒台 · 细化玻璃与金属"><img loading="lazy" src="04-workbench.png" alt="调酒台 · 细化玻璃与金属"></button><figcaption><b>调酒台 · 细化玻璃与金属</b><p>恢复原来的器型、瓶型和酒标；底部提示栏不再挡住摇壶。</p></figcaption></figure><figure><button class="shot" data-full="03-research.png" aria-label="放大研发入口 · 书桌与手稿"><img loading="lazy" src="03-research.png" alt="研发入口 · 书桌与手稿"></button><figcaption><b>研发入口 · 书桌与手稿</b><p>笔记本进入自由 DIY，手稿进入传说研习，配方盒查看已保存配方。</p></figcaption></figure><figure><button class="shot" data-full="03-shop.png" aria-label="放大港口货栈 · 老板娘"><img loading="lazy" src="03-shop.png" alt="港口货栈 · 老板娘"></button><figcaption><b>港口货栈 · 老板娘</b><p>重新制作半身立绘，保留白发、围巾、罗盘胸针与围裙。</p></figcaption></figure><figure><button class="shot" data-full="02-home-hank.png" aria-label="放大老霍克 · 半身立绘"><img loading="lazy" src="02-home-hank.png" alt="老霍克 · 半身立绘"></button><figcaption><b>老霍克 · 半身立绘</b><p>保留原来帽子、灰胡须、衬衫与马甲，完整显示双手。</p></figcaption></figure><figure><button class="shot" data-full="02-home-ada.png" aria-label="放大艾达 · 半身立绘"><img loading="lazy" src="02-home-ada.png" alt="艾达 · 半身立绘"></button><figcaption><b>艾达 · 半身立绘</b><p>保留辫发、蓝衬衫、红围巾和扶帽动作。</p></figcaption></figure><figure><button class="shot" data-full="02-home-milo.png" aria-label="放大米洛 · 半身立绘"><img loading="lazy" src="02-home-milo.png" alt="米洛 · 半身立绘"></button><figcaption><b>米洛 · 半身立绘</b><p>保留胡须、帽子、白衬衫、马甲与领巾。</p></figcaption></figure><figure><button class="shot" data-full="03-codex.png" aria-label="放大酒馆图鉴 · 原杯型像素重绘"><img loading="lazy" src="03-codex.png" alt="酒馆图鉴 · 原杯型像素重绘"></button><figcaption><b>酒馆图鉴 · 原杯型像素重绘</b><p>保留原酒款的杯型、酒体与装饰。此截图是未点亮状态，沿用图鉴的淡墨处理。</p></figcaption></figure><figure><button class="shot" data-full="06-glass-liquid-alignment.png" aria-label="放大杯型与动态液面"><img loading="lazy" src="06-glass-liquid-alignment.png" alt="杯型与动态液面"></button><figcaption><b>杯型与动态液面</b><p>四种杯型的实际运行截图，液体仍由游戏动态绘制。</p></figcaption>
